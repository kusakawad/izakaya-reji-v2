/* --- サブ（子機） --- */
function subJoin(){
  if(SY.role==='host'&&SY.peers.some(p=>p.ok)){toast('ホストとして使っている間はサブにできません');return;}
  openScan('ホストのQRを読み取る','ホストの端末で「設定 › 端末連携 › サブ端末を追加」を押し、出てきたQRを写してください。',async txt=>{
    let u=null; try{u=await unpackSdp(txt)}catch(e){syncErr('読み取れませんでした',unpackErr(e));return;}
    if(!u||u.kind!=='o'){syncErr('読み取れませんでした',u?'これはサブ側のQRです。ホストの端末に出たQRを読み取ってください。':unpackErr());return;}
    loadingSheet('ホストにつなぐ','返事のQRコードを用意しています…');
    if(SY.host){try{SY.host.pc.close()}catch(e){}SY.host=null;}
    let h;
    try{h={pc:new RTCPeerConnection(RTC_CFG),dc:null,ck:{},rx:0,name:''};}catch(e){syncErr('ホストにつなぐ',rtcErr(e));return;}
    SY.host=h;
    h.pc.ondatachannel=ev=>{h.dc=ev.channel;
      h.dc.onopen=()=>{
        if(SY.host!==h)return;
        SY.newJoin=SY.role!=='sub'; SY.got=false;
        if(SY.role!=='sub'){SY.role='sub';saveSync();}
        SY.ok=true; SY.seq=0; h.rx=Date.now(); wakeOn();
        sendJSON(h.dc,{t:'hi',name:synName()});
      };
      h.dc.onmessage=ev2=>{if(SY.host===h)onRaw(h,ev2.data,subMsg);};
      h.dc.onclose=()=>{if(SY.host===h)subLost();};
    };
    h.pc.onconnectionstatechange=()=>{if(SY.host===h&&['failed','closed'].includes(h.pc.connectionState))subLost();};
    let code='';
    try{
      await h.pc.setRemoteDescription({type:'offer',sdp:u.sdp});
      await h.pc.setLocalDescription(await h.pc.createAnswer()); await waitIce(h.pc);
      if(!hasCand(h.pc.localDescription.sdp))throw new Error('nocand');
      code=await packSdp('a',h.pc.localDescription.sdp);
    }catch(e){if(SY.host===h)SY.host=null;try{h.pc.close()}catch(_){}syncErr('ホストにつなぐ',e&&e.message==='nocand'||typeof RTCPeerConnection==='undefined'?rtcErr(e):'このQRは使えませんでした。ホストでもう一度「サブ端末を追加」からやり直してください。');return;}
    if(SY.host!==h)return;
    showModal(`${sheetHead('ホストで読み取ってください')}<div class="mb" id="sywait">
      <ol class="steps"><li>ホストの端末で「サブのQRを読み取る」を押します。</li><li>このQRを読み取ってもらうと、自動でつながります。</li></ol>
      <div class="qrwrap"><div class="qrbox">${qrSvg(code)}</div></div>${codeAlt(code)}</div>
      <div class="mbtns"><button class="btn btn-line" data-a="mclose">キャンセル</button></div>`);
  });
}
function rebase(){SY.base={};S.tables.forEach(t=>SY.base['t:'+t.id]=JSON.stringify(t));S.sales.forEach(x=>SY.base['s:'+x.id]=JSON.stringify(x));}
function subMsg(h,m){
  if(m.t!=='state'||!m.d)return;
  h.name=String(m.host||'');
  /* まだホストが処理していない操作があるときの古い状態は使わない（次に届く状態を待つ） */
  if((+m.ack||0)<SY.seq)return;
  const first=!SY.got;
  S=normalize(m.d); rebase(); SY.got=true;
  if(first){
    if(SY.newJoin){done=null;clip=null;curCat=0;view={name:'tables'};render.route=null;SY.newJoin=false;}
    if(modalOpen())closeModal(); toast(`ホスト「${h.name||'ホスト'}」と接続しました`); render(); return;}
  syncRender();
}
function syncPush(){
  const h=SY.host; if(!h||!SY.ok||!SY.got)return;
  const tables=S.tables.filter(t=>JSON.stringify(t)!==SY.base['t:'+t.id]);
  const sales=S.sales.filter(x=>JSON.stringify(x)!==SY.base['s:'+x.id]);
  if(!tables.length&&!sales.length)return;
  rebase(); sendJSON(h.dc,{t:'ops',seq:++SY.seq,tables,sales});
}
function subLost(){
  if(!SY.ok&&!SY.host)return;
  SY.ok=false;
  const h=SY.host; SY.host=null; if(h){try{h.pc.close()}catch(e){}}
  if(SY.role==='sub'){if(modalOpen()&&!$('scanv'))closeModal();syncRender();}
}
function subLeave(){
  const h=SY.host; SY.host=null; SY.ok=false; SY.got=false; if(h){try{h.pc.close()}catch(e){}}
  SY.role='off'; saveSync();
  /* この端末に保存してある元のデータに戻す */
  let D=null; try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  S=normalize(D&&Array.isArray(D.items)&&Array.isArray(D.tables)?D:defaults());
  done=null; clip=null; curCat=0; view={name:'tables'}; render.route=null;
  toast('連携をやめました');
}

}

    case 'paste': pasteItem(b.dataset.c); return;
    case 'clipclear': clip=null; break;
    case 'cnew': openCatName(null); return;
    case 'cren': openCatName(id); return;
    case 'csave': {const name=$('cname').value.trim(); if(!name){toast('カテゴリ名を入力してください');return;}
      if(S.cats.some(c=>c.name===name&&c.id!==editId)){toast('同じ名前のカテゴリがあります');return;}
      if(editId)S.cats.find(c=>c.id===editId).name=name; else S.cats.push({id:uid(),name});
      save(); closeModal(); break;}
    case 'syadd': hostAdd(); return;
    case 'syscan2': hostScanAnswer(); return;
    case 'syjoin': subJoin(); return;
    case 'sycode': {const v=($('sycodein')||{}).value||''; if(!v.trim()){toast('コードを貼り付けてください');return;} stopScan(); if(scanCb){const f=scanCb;scanCb=null;f(v.trim());} return;}
    case 'sycopy': copyText(b.dataset.v).then(ok=>toast(ok?'コピーしました':'コピーできませんでした')); return;
    case 'sykick': {const p=SY.peers.find(x=>x.id===id); if(p){dropPeer(p); toast(`${p.name||'サブ端末'}を切断しました`);} break;}
    case 'systop': confirmBox('連携をやめて、つながっているサブ端末をすべて切断しますか？',()=>{SY.peers.slice().forEach(dropPeer);SY.role='off';saveSync();},'連携をやめる',true); return;
    case 'syleave': confirmBox('連携をやめますか？<br>この端末に入っている元のデータに戻ります。ホストのデータはそのまま残ります。',()=>subLeave(),'連携をやめる',true); return;
    case 'cdel': openCatDel(id); return;
    case 'cdelok': {const to=$('cmove').value; S.items.forEach(i=>{if(i.cat===editId)i.cat=to;});
      S.cats=S.cats.filter(c=>c.id!==editId); curCat=0; save(); closeModal(); toast('削除しました'); break;}
    case 'txtout': openTextOut(b.dataset.c); return;
    case 'txtcopy': copyText($('txtbox').value).then(ok=>toast(ok?'コピーしました':'コピーできませんでした。文字を長押しして選んでください')); return;
    case 'txtin': openTextIn(); return;
    case 'txtok': applyText(); return;
    case 'iedit': openItem(id); return;
    case 'isave': {const name=$('iname').value.trim();const raw=$('iprice').value.replace(/−/g,'-').replace(/[^\d-]/g,'');const price=parseInt(raw);
      if(!name){toast('品名を入力してください');return;}
      if(isNaN(price)){toast('価格を数字で入力してください');return;}
      const cat=$('icat').value, ask=$('iask').checked;
      if(editId){Object.assign(S.items.find(i=>i.id===editId),{name,price,cat,ask});}
      else S.items.push({id:uid(),name,price,cat,ask});
      save(); closeModal(); toast('保存しました'); break;}
    case 'idel': {const it=S.items.find(i=>i.id===editId);
      confirmBox(`「${esc(it.name)}」を削除しますか？`,()=>{S.items=S.items.filter(i=>i.id!==editId);},'削除する',true); return;}
    case 'tnew': openTableName(null); return;
    case 'tren': openTableName(id); return;
    case 'tsave': {const name=$('tname').value.trim(); if(!name){toast('テーブル名を入力してください');return;}
      if(editId)S.tables.find(x=>x.id===editId).name=name;
      else S.tables.push({id:uid(),name,open:false,guests:0,start:0,lines:[],stack:[]});
      save(); closeModal(); break;}
    case 'tdel': {const tb=S.tables.find(x=>x.id===id);
      confirmBox(`テーブル「${esc(tb.name)}」を削除しますか？`,()=>{S.tables=S.tables.filter(x=>x.id!==id);},'削除する',true); return;}
    case 'rsales': confirmBox('売上履歴をすべて消去します。<br>先に「売上」タブからCSVを保存しておくと安心です。<br>使用中のテーブルはそのまま残ります。',()=>{S.sales=[];done=null;},'リセット',true); return;
    case 'rall': confirmBox('品目・テーブル・売上をすべて初期状態に戻します。',()=>{S=normalize(defaults());curCat=0;clip=null;logoImg=null;done=null;view={name:'tables'};},'初期化する',true); return;
  }
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='sy-name'){SY.name=e.target.value.trim().slice(0,16);saveSync();}if(e.target.id==='iprice'||e.target.id==='pval')markNeg(e.target);if(e.target.id==='paid')updChg();if(e.target.id==='txtin')updTextPrev();});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.hasAttribute('data-pk')){payKind=el.value;updPay();return;}
  if(el.hasAttribute('data-pm')){payMethod=el.value;updPay();return;}
  if(el.dataset.psel){paySel[el.dataset.psel]=el.checked;updPay();return;}
  if(el.hasAttribute('data-paydef')){S.pay.def=el.value;save();render();toast('初期値を変更しました');return;}
  const dk=el.dataset.disc, vk=el.dataset.svc;
  if(dk||vk){
    const o=dk?S.disc:S.svc, k=dk||vk; let v=el.value;
    if(k==='pct'){v=parseFloat(z2h(v).replace(/[^\d.]/g,'')); if(isNaN(v))v=0;
      if(v<0||v>100){toast('割合は0〜100の数字で入力してください');el.value=o[k];return;}}
    else if(k==='fixed'){v=parseInt(z2h(v).replace(/[^\d]/g,''))||0;}
    else if(k==='digits'){v=Math.max(0,Math.min(5,+v||0));}
    else if(k==='taxOn'){v=el.checked;}
    else if(/Mode$/.test(k)||k==='fixedPer'||k==='taxWhen'){/* ラジオの値をそのまま使う */}
    else {v=v.trim(); if(!v){el.value=o[k];toast('レシートの表記を入力してください');return;}}
    o[k]=v; save(); render(); toast('保存しました'); return;
  }
  if(el.id==='bfile'){if(el.files&&el.files[0])importBackup(el.files[0]);return;}
  if(el.id==='logofile'){if(el.files&&el.files[0])loadLogo(el.files[0]);return;}
  const sk=el.dataset.shop;
  if(sk){
    let v=el.value.trim();
    if(sk==='paper')v=+v;
    if(sk==='regno'){v=v.toUpperCase().replace(/[^T\d]/g,'');if(v&&!/^T\d{13}$/.test(v))toast('登録番号は「T＋13桁の数字」です（このまま保存しました）');}
    S.shop[sk]=v; save(); if(sk==='paper')render(); else toast('保存しました'); return;
  }
  if(el.id==='txtcat'){updTextPrev();return;}
  const k=el.dataset.tax; if(!k)return;
  if(k==='main'||k==='sub'){
    const v=parseFloat(el.value.replace(/[^\d.]/g,''));
    if(isNaN(v)||v<0||v>100){toast('税率は0〜100の数字で入力してください');el.value=S.tax[k];return;}
    S.tax[k]=v;
  }else if(k==='mainName'||k==='subName'){
    const v=el.value.trim(); if(!v){el.value=S.tax[k];return;} S.tax[k]=v;
  }else S.tax[k]=el.value;
  save(); render(); toast('税の設定を保存しました');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen())closeModal();});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
setInterval(()=>{const c=$('clock');if(c)c.textContent=nowHM();},10000);
setInterval(()=>{if(!$('ov').classList.contains('show')&&(view.name==='tables'||view.name==='order'))render();},30000);
render();
</script>

/* オフライン対応（GitHub Pages など https で公開したときだけ有効） */
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
