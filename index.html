<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="居酒屋レジ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* 基本のリセット（セーフエリア・非表示属性） */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>居酒屋レジ あかり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* Layout: iOS の階層ナビゲーション（ナビバー＋下部タブバー＋シート）を、デジタル庁デザインシステムのトークンで組む */
:root{
  /* デジタル庁デザインシステム（DADS）のトークン */
  --bg:#f2f2f2;          /* Solid Gray 50：画面の地 */
  --surface:#ffffff;     /* White：カード・リスト */
  --text:#1a1a1a;        /* Solid Gray 900 */
  --text-2:#4d4d4d;      /* Solid Gray 700：補足（白・地色どちらでも 4.5:1 以上） */
  --border:#949494;      /* Solid Gray 420：操作できる部品の枠（3:1） */
  --divider:#e6e6e6;     /* Solid Gray 100：区切り線（装飾） */
  --key:#0017c1;         /* Blue 900：キーカラー */
  --key-hover:#00118f;   /* Blue 1000 */
  --key-active:#000071;  /* Blue 1100 */
  --key-bg:#e8f1fe;      /* Blue 50 */
  --key-bg-2:#d9e6ff;    /* Blue 100 */
  --on-key:#ffffff;
  --void-fg:#ce0000;     /* 会計取り消しボタン：赤枠・白地・赤文字（ライト・ダーク共通） */
  --void-bg:#ffffff;
  --void-bg-active:#fdeeee;
  --badge-bg:#0017c1;   /* タイトル横のアイコン：Blue 900 の地に白（ライト・ダーク共通） */
  --badge-fg:#ffffff;
  --success:#197a4b;     /* Green 800 */
  --success-bg:#e6f5ec;  /* Green 50 */
  --error:#ce0000;       /* Red 900 */
  --error-hover:#a90000; /* Red 1000 */
  --error-bg:#fdeeee;    /* Red 50 */
  --focus-y:#ffd43d;     /* Yellow 300（フォーカスは黄＋黒の二重。変更しない） */
  --focus-k:#000000;
  --scrim:rgba(0,0,0,.5);
  --receipt:#ffffff;
  --elev-1:0 2px 8px 1px rgba(0,0,0,.1),0 1px 5px 0 rgba(0,0,0,.3);
  --elev-3:0 4px 16px 3px rgba(0,0,0,.1),0 1px 6px 0 rgba(0,0,0,.3);
  --elev-5:0 8px 24px 5px rgba(0,0,0,.1),0 2px 10px 0 rgba(0,0,0,.3);
  --font:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --ease:cubic-bezier(.32,.72,0,1);   /* iOS の画面遷移・シートに近い減速カーブ */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1c; --text:#f2f2f2; --text-2:#b3b3b3; --border:#7f7f7f; --divider:#333333;
  --key:#9db7f9; --key-hover:#c5d7fb; --key-active:#d9e6ff; --key-bg:#0b1747; --key-bg-2:#13246b; --on-key:#000060;
  --success:#2cac6e; --success-bg:#0c2e1d; --error:#ff7a7a; --error-hover:#ffa3a3; --error-bg:#3a1010;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1c; --text:#f2f2f2; --text-2:#b3b3b3; --border:#7f7f7f; --divider:#333333;
  --key:#9db7f9; --key-hover:#c5d7fb; --key-active:#d9e6ff; --key-bg:#0b1747; --key-bg-2:#13246b; --on-key:#000060;
  --success:#2cac6e; --success-bg:#0c2e1d; --error:#ff7a7a; --error-hover:#ffa3a3; --error-bg:#3a1010;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;letter-spacing:.02em;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;background:none;border:0;padding:0}
:focus-visible{outline:4px solid var(--focus-k);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-y)}
.ic{flex:0 0 auto;display:block}
.num{font-variant-numeric:tabular-nums;letter-spacing:0}
#app{height:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.wrap{flex:1;min-height:0;display:flex;flex-direction:column}

/* 横の余白（8px グリッド・セーフエリア込み） */
.nav,.tabbar,.sec,.line,.sumbar,.cats,.igrid,.actions,.empty,.banner-w{
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- ナビゲーションバー ---------- */
.nav{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:8px;min-height:56px;padding-block:8px}
.nav.large{min-height:64px;padding-block:12px 8px}
.ltitle{flex:1;min-width:0;margin:0;display:flex;align-items:center;gap:12px;font-size:28px;font-weight:700;line-height:1.5;letter-spacing:.01em}
.tbadge{flex:0 0 auto;width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--badge-bg);color:var(--badge-fg)}
.clock{display:flex;align-items:center;gap:6px;font-size:16px;color:var(--text-2)}
.navtitle{flex:1;min-width:0;text-align:center;line-height:1.3}
.navtitle b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navtitle span{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--text-2)}
.navbtn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;gap:2px;color:var(--key);font-size:17px;border-radius:var(--r-sm);padding:0 4px}
.navbtn:active{opacity:.5}
.navbtn.right{justify-content:flex-end;gap:6px;padding:0 8px}

/* ---------- タブバー（下部） ---------- */
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--divider);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-2);font-size:14px;line-height:1.2;border-radius:var(--r-sm)}
.tabbar button[aria-current="page"]{color:var(--key);font-weight:700}
.tabbar button.just .ic{animation:tabPop .45s var(--ease)}
@keyframes tabPop{0%{transform:scale(.75)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.scroll{flex:1;min-height:0;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* ---------- 画面遷移（プッシュ／ポップ／タブ切替） ---------- */
.vt-push{animation:push .45s var(--ease) both}
.vt-pop{animation:pop .45s var(--ease) both}
.vt-fade{animation:fade .25s ease both}
@keyframes push{from{transform:translateX(100%)}}
@keyframes pop{from{transform:translateX(-30%);opacity:.4}}
@keyframes fade{from{opacity:0}}
.stagger>*{animation:rise .4s var(--ease) both;animation-delay:calc(var(--i,0)*24ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* ---------- ボタン（DADS：塗り／アウトライン／テキスト） ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:48px;padding:0 20px;border-radius:var(--r-sm);font-size:16px;font-weight:700;line-height:1.2;
  transition:background-color .15s,transform .12s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-fill{background:var(--key);color:var(--on-key)}
.btn-fill:active{background:var(--key-active)}
.btn-line{background:var(--surface);color:var(--key);box-shadow:inset 0 0 0 1px var(--key)}
.btn-line:active{background:var(--key-bg-2)}
.btn-text{color:var(--key);text-decoration:underline;text-underline-offset:3px;padding:0 12px}
.btn-text:active{background:var(--key-bg-2)}
.btn-danger{background:var(--error);color:var(--surface)}
.btn-danger:active{background:var(--error-hover)}
.btn-lg{min-height:56px;font-size:17px;padding:0 28px}
.btn-sm{min-height:44px;padding:0 14px;font-size:14px}
.btn-block{width:100%}
@media (hover:hover){
  .btn-fill:hover{background:var(--key-hover);text-decoration:underline;text-underline-offset:3px}
  .btn-line:hover{background:var(--key-bg);text-decoration:underline;text-underline-offset:3px}
  .btn-text:hover{background:var(--key-bg)}
  .btn-danger:hover{background:var(--error-hover);text-decoration:underline;text-underline-offset:3px}
}

/* ---------- テーブル一覧 ---------- */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:16px 0}
.summary div{background:var(--surface);border-radius:var(--r-md);padding:12px;min-width:0}
.summary small{display:block;font-size:14px;color:var(--text-2);line-height:1.3}
.summary b{display:block;font-size:22px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;padding-block:16px 24px}
.tcard{position:relative;background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--border);min-height:112px;padding:12px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:4px;text-align:left;transition:transform .15s var(--ease),background-color .2s}
.tcard:active{transform:scale(.96)}
.tcard .tname{font-size:22px;font-weight:700;line-height:1.3}
.tcard .tstate{display:inline-flex;align-items:center;gap:4px;font-size:14px;line-height:1.3;color:var(--text-2)}
.tcard .tamt{font-size:17px;font-weight:700;line-height:1.3}
.tcard.busy{background:var(--key-bg);box-shadow:inset 0 0 0 2px var(--key)}
.tcard.busy .tstate{color:var(--key);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;line-height:1.3;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--key);color:var(--on-key)}

/* 会計完了の通知バナー（DADS：完了はダイアログでなくバナーで知らせる） */
.banner-w{padding-block:16px 0}
.banner{background:var(--success-bg);border-radius:var(--r-md);box-shadow:inset 0 0 0 2px var(--success);padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start}
.banner.fresh{animation:bannerIn .5s var(--ease) both}
@keyframes bannerIn{from{opacity:0;transform:translateY(-16px)}}
.banner .bic{color:var(--success);grid-row:span 2}
.banner .bic circle,.banner .bic path{stroke-dasharray:1;stroke-dashoffset:0}
.banner.fresh .bic circle{animation:draw .5s ease-out .15s both}
.banner.fresh .bic path{animation:draw .35s ease-out .55s both}
@keyframes draw{from{stroke-dashoffset:1}}
.banner h2{margin:0;font-size:17px;line-height:1.5;color:var(--success)}
.banner .close{grid-column:3;grid-row:1;min-width:44px;min-height:44px;margin:-10px -10px 0 0;display:grid;place-items:center;color:var(--text);border-radius:var(--r-sm)}
.banner .body{grid-column:2/4}
.banner .chg{display:flex;align-items:baseline;gap:12px;font-size:16px}
.banner .chg b{font-size:36px;line-height:1.4;font-weight:700}
.banner .meta{font-size:14px;color:var(--text-2);line-height:1.5}
.banner .bbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ---------- 注文画面 ---------- */
.lines{flex:1 1 auto;min-height:96px;overflow:auto;background:var(--surface)}
.line{display:flex;align-items:center;gap:12px;min-height:64px;padding-block:8px;border-bottom:1px solid var(--divider)}
.line .ln{flex:1;min-width:0;text-align:left;font-size:16px;font-weight:700;line-height:1.3;min-height:44px;display:flex;flex-direction:column;justify-content:center;border-radius:var(--r-sm)}
.line .ln small{font-size:14px;font-weight:400;color:var(--text-2);margin-top:2px}
.tag{display:inline-block;margin-left:8px;padding:0 8px;border-radius:999px;background:var(--key-bg);color:var(--key);box-shadow:inset 0 0 0 1px var(--key);font-size:14px;font-weight:700;line-height:1.5;vertical-align:1px}
.stepper{display:flex;align-items:center;border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--border);background:var(--surface)}
.stepper button{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-sm);transition:background-color .15s}
.stepper button:active{background:var(--key-bg-2)}
.stepper .qn{min-width:28px;text-align:center;font-weight:700;display:inline-block}
.lsub{width:84px;text-align:right;font-weight:700;display:inline-block}
.line.is-new{animation:lineIn .5s var(--ease) .32s backwards}
@keyframes lineIn{from{opacity:0;transform:translateY(-8px);background:var(--key-bg)}50%{background:var(--key-bg)}to{background:transparent}}
.line.is-bump .qn,.line.is-bump .lsub{animation:bump .4s var(--ease) .28s}
@keyframes bump{40%{transform:scale(1.3);color:var(--key)}}
.empty{color:var(--text-2);text-align:center;padding-block:32px;font-size:14px;line-height:1.7}
.empty .ic{margin:0 auto 8px;opacity:.7}

.sumbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-top:1px solid var(--divider);border-bottom:1px solid var(--divider);padding-block:4px;line-height:1.2}
.sumbar .cnt{font-size:14px;color:var(--text-2);white-space:nowrap}
.sumbar .cnt b{font-size:17px;color:var(--text);margin-right:2px}
.sumr{display:flex;align-items:baseline;gap:8px;min-width:0}
.sumr small{font-size:14px;line-height:1.2;color:var(--text-2);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.total{font-size:28px;font-weight:700;line-height:1.2;display:inline-block;transform-origin:right center;white-space:nowrap}

/* カテゴリ（DADS タブ：選択中は太字＋下線、下線はスライド） */
.cats{flex:0 0 auto;position:relative;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--divider)}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;min-height:44px;padding:0 16px;font-size:16px;line-height:1.2;color:var(--text-2)}
.cats button.on{color:var(--text);font-weight:700}
.cthumb{position:absolute;bottom:0;left:0;height:3px;background:var(--key);border-radius:2px 2px 0 0}

.igrid{flex:0 0 auto;max-height:22vh;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding-block:8px;background:var(--bg)}
.item{background:var(--surface);border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--border);min-height:80px;padding:8px 10px;letter-spacing:0;
  display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;text-align:left;min-width:0;gap:4px;transition:transform .12s var(--ease),background-color .15s}
.item:active{transform:scale(.95);background:var(--key-bg)}
.iname{font-weight:700;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.iprice{font-size:16px;line-height:1.3;color:var(--text-2);text-align:right}
.ask{font-size:14px;color:var(--key);font-weight:700}
.igrid .empty{grid-column:1/-1}

.actions{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--divider)}
.actions .sp{flex:1}
.actions .btn{flex:0 0 auto;white-space:nowrap;padding:0 14px}
.actions .btn-lg{padding:0 20px}
.actions .btn-text{padding:0 8px}

/* ---------- 売上・設定（インセットのグループ） ---------- */
.sec{padding-block:16px 40px}
.sec h2{font-size:20px;font-weight:700;line-height:1.5;margin:32px 0 8px}
.sec>h2:first-child,.sec>.kpis+h2{margin-top:24px}
.sec h3{font-size:16px;font-weight:700;margin:24px 0 8px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--surface);border-radius:var(--r-md);padding:12px 16px;min-width:0}
.kpi small{display:block;color:var(--text-2);font-size:14px;line-height:1.5}
.kpi div{font-size:24px;font-weight:700;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.lead{grid-column:1/-1}
.kpi.lead div{font-size:36px;line-height:1.4}
.tblw{overflow-x:auto;border-radius:var(--r-md);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:16px;line-height:1.5}
.tbl th,.tbl td{padding:12px 16px;border-bottom:1px solid var(--divider);text-align:left;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:14px;color:var(--text-2);font-weight:700}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.ranks{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.rank{position:relative;display:grid;grid-template-columns:1fr auto 96px;gap:12px;align-items:center;min-height:48px;padding:8px 16px;border-bottom:1px solid var(--divider);font-size:16px;line-height:1.3}
.rank:last-child{border-bottom:0}
.rank i{position:absolute;left:0;top:6px;bottom:6px;width:100%;background:var(--key-bg-2);border-radius:0 4px 4px 0;transform-origin:left;transform:scaleX(var(--w,0))}
.rank span{position:relative;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rq{color:var(--text-2)}
.rank .ra{text-align:right;font-weight:700}
.grow-in .rank i{animation:grow .7s var(--ease) both;animation-delay:calc(var(--i,0)*40ms + .1s)}
@keyframes grow{from{transform:scaleX(0)}}
.group{background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.sale{padding:12px 16px;border-bottom:1px solid var(--divider)}
.sale:last-child{border-bottom:0}
.sale .top{display:flex;justify-content:space-between;gap:12px;font-weight:700;line-height:1.5}
.sale .det{font-size:14px;color:var(--text-2);margin-top:4px;line-height:1.7}
.salebtns{display:flex;gap:8px;margin-top:8px}
.row{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;padding:6px 8px 6px 16px;border-bottom:1px solid var(--divider);text-align:left;font-size:16px;line-height:1.5}
.group>.row:last-child{border-bottom:0}
button.row:active{background:var(--key-bg)}
.row .grow{flex:1;min-width:0}
.row .ic.chev{color:var(--text-2)}
.muted{color:var(--text-2)}
.gh{font-size:14px!important;font-weight:700;color:var(--text-2);margin:24px 0 8px 16px!important;line-height:1.5}
.sec>.gh:first-child{margin-top:8px!important}
.gnote{margin:8px 16px 0}
.srow .sic{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--key-bg);color:var(--key);flex:0 0 auto;margin-right:4px}
.srow .sval{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--key)}
.iconbtn:active{background:var(--key-bg-2)}
.iconbtn.ghost{visibility:hidden}
.addrow{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;padding:0 16px;color:var(--key);font-weight:700;font-size:16px}
.addrow:active{background:var(--key-bg)}
.addrow.paste{background:var(--key-bg)}
.note{color:var(--text-2);font-size:14px;line-height:1.7;margin:8px 0}
.note.warn{color:var(--error);display:flex;gap:8px;align-items:flex-start}
.ck{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;font-size:16px;line-height:1.5;border-bottom:1px solid var(--divider)}
.group>.ck:last-child{border-bottom:0}
.ck input{width:24px;height:24px;margin:0;accent-color:var(--key);flex:0 0 auto}
.ck small{display:block;color:var(--text-2);font-size:14px;line-height:1.5}
.inline-ck{padding:8px 0;border:0}
.taxgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.seg{position:relative;display:flex;background:var(--divider);border-radius:var(--r-sm);padding:2px;margin:4px 0 8px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 4px;font-size:16px;color:var(--text);border-radius:6px;transition:background-color .25s var(--ease),box-shadow .25s}
.seg input:checked+span{background:var(--surface);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.seg input:focus-visible+span{outline:4px solid var(--focus-k);outline-offset:0;box-shadow:0 0 0 2px var(--focus-y)}
.taxline{text-align:center;color:var(--text-2);font-size:14px;margin:0 0 16px}
.logobox{display:flex;align-items:center;justify-content:center;gap:8px;min-height:80px;border-radius:var(--r-md);background:var(--receipt);padding:12px;color:#4d4d4d;box-shadow:inset 0 0 0 1px var(--border)}
.logobox img{max-width:70%;max-height:120px}
.rprev{background:var(--bg);border-radius:var(--r-md);padding:16px 8px;display:flex;justify-content:center;max-height:52vh;overflow:auto}
.rprev img{width:100%;height:auto;box-shadow:var(--elev-1);background:var(--receipt);animation:printOut .6s var(--ease) both}
@keyframes printOut{from{clip-path:inset(0 0 100% 0);transform:translateY(-12px)}}
.cathd{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:24px 0 8px}
.cathd h3{margin:0}
.clipbar{display:flex;align-items:center;gap:12px;background:var(--key-bg);box-shadow:inset 0 0 0 1px var(--key);border-radius:var(--r-md);padding:12px 8px 12px 16px;margin:8px 0;font-size:16px;line-height:1.5}
.clipbar small{display:block;color:var(--text-2);font-size:14px}
.clipbar .grow{flex:1;min-width:0}
.txt{width:100%;font:inherit;font-size:16px;line-height:1.7;padding:12px 16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);resize:vertical;margin-bottom:8px}
.prev{font-size:16px;line-height:1.7}
.prev .bad{color:var(--error);font-size:14px;margin-top:4px;word-break:break-all}
.btnrow{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

/* ---------- フォーム（DADS インプット） ---------- */
.fl{display:block;font-size:16px;font-weight:700;line-height:1.5;margin-bottom:16px}
.fl input,.fl select{display:block;width:100%;margin-top:8px;font:inherit;font-weight:400;font-size:16px;min-height:56px;padding:0 16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text)}
.pricerow{display:flex;gap:8px;align-items:flex-end}
.pricerow .fl{flex:1;min-width:0}
.btn.pm{flex:0 0 auto;min-height:56px;width:64px;padding:0;margin-bottom:16px}
.fl input.neg{color:var(--error);font-weight:700}
.fl input.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.fl input[aria-invalid="true"]{border:2px solid var(--error)}
.err{display:flex;align-items:center;gap:6px;color:var(--error);font-size:16px;font-weight:700;margin:-8px 0 12px}
.err.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- シート／ダイアログ ---------- */
.ov{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.show{display:flex;animation:fade .3s ease both}
.ov.closing{animation:fadeOut .25s ease both}
.ov.dlg{align-items:center;padding:24px}
@keyframes fadeOut{to{opacity:0}}
.modal{background:var(--surface);width:100%;max-height:92%;overflow:auto;box-shadow:var(--elev-5)}
.modal.sheet{max-width:600px;border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  animation:sheetUp .5s var(--ease) both;touch-action:pan-y}
.ov.closing .modal.sheet{animation:sheetDown .25s ease-in both}
@keyframes sheetUp{from{transform:translateY(100%)}}
@keyframes sheetDown{to{transform:translateY(100%)}}
.modal.dialog{max-width:400px;border-radius:var(--r-lg);animation:dlgIn .3s var(--ease) both}
.ov.closing .modal.dialog{animation:dlgOut .2s ease-in both}
@keyframes dlgIn{from{opacity:0;transform:scale(1.08)}}
@keyframes dlgOut{to{opacity:0;transform:scale(.96)}}
@media (min-width:640px){.ov.sheetmode{align-items:center;padding:24px}.modal.sheet{border-radius:var(--r-lg);padding-bottom:0}}
.shd{position:relative;padding:20px 16px 8px;text-align:center;cursor:grab}
.shd::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--border)}
.shd h2{margin:0;font-size:17px;font-weight:700;line-height:1.5}
.dlg-h{display:flex;align-items:center;gap:8px;padding:24px 24px 0;margin:0;font-size:20px;font-weight:700;line-height:1.5}
.dlg-h .ic{color:var(--error)}
.mb{padding:8px 16px 16px}
.modal.dialog .mb{padding:8px 24px 16px}
.mbtns{display:flex;gap:8px;padding:0 16px 16px}
.modal.dialog .mbtns{padding:0 24px 24px}
.mbtns .btn{flex:1}
.paytot{text-align:center;font-size:45px;font-weight:700;line-height:1.4;margin:8px 0 0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.quick .btn{padding:0 4px}
.chg{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;padding:12px 0;border-top:1px solid var(--divider)}
.chg b{font-size:32px;line-height:1.5;font-weight:700}
.gg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gg .btn{min-height:56px;font-size:22px;padding:0}
.msg{font-size:16px;line-height:1.7}

/* ---------- 演出レイヤー ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.flychip{position:fixed;left:0;top:0;display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--key);color:var(--on-key);font-weight:700;font-size:14px;line-height:1.3;white-space:nowrap;box-shadow:var(--elev-3);will-change:transform}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);display:flex;align-items:center;gap:8px;background:var(--text);color:var(--surface);padding:12px 20px;border-radius:var(--r-md);font-size:16px;line-height:1.5;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .35s var(--ease);z-index:60;max-width:calc(100% - 32px);box-shadow:var(--elev-3)}
#toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- 会計取り消し ---------- */
.btn-void{background:var(--void-bg);color:var(--void-fg);box-shadow:inset 0 0 0 1px var(--void-fg)}
.btn-void:active{background:var(--void-bg-active)}
@media (hover:hover){.btn-void:hover{background:var(--void-bg-active);text-decoration:underline;text-underline-offset:3px}}
/* レシート・領収書・取り消しを1列に（375px幅でも収まるよう余白を詰める） */
.banner .bbtns{grid-column:1/-1;flex-wrap:nowrap}
.bbtns,.salebtns{flex-wrap:nowrap!important;gap:8px}
.bbtns .btn,.salebtns .btn{padding:0 10px;gap:6px;flex:0 0 auto}
.bbtns .btn-void,.salebtns .btn-void{margin-left:auto}
.sale.voided .top .amt{text-decoration:line-through;color:var(--text-2)}
.sale.voided .top>span:first-child,.sale.voided .det{color:var(--text-2)}
.vtag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;line-height:1.5;color:var(--void-fg);background:var(--void-bg);box-shadow:inset 0 0 0 1px var(--void-fg)}

/* ---------- 会計シート：支払い方法・内訳・スイッチ ---------- */
.mlabel{font-size:16px;font-weight:700;line-height:1.5;margin:4px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--border);font-size:16px;background:var(--surface);transition:background-color .2s,color .2s}
.chips input:checked+span{background:var(--key);color:var(--on-key);box-shadow:none;font-weight:700}
.chips input:focus-visible+span{outline:4px solid var(--focus-k);outline-offset:2px;box-shadow:0 0 0 2px var(--focus-y)}
.bd{border-radius:var(--r-md);background:var(--bg);padding:4px 12px;margin:4px 0 0}
.bdr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;border-bottom:1px solid var(--divider)}
.bdr:last-child{border-bottom:0}
.bdl{display:flex;align-items:center;gap:12px;min-width:0;flex:1;font-size:16px;line-height:1.3;cursor:default}
.bdl:has(.sw){cursor:pointer}
.bdl small{display:block;font-size:14px;color:var(--text-2);margin-top:2px}
.bdl .always{color:var(--key);font-weight:700}
.bdr b{font-size:16px;white-space:nowrap}
.bdr.off b,.bdr.off .bdl>span{color:var(--text-2)}
.bdnote{display:flex;gap:6px;align-items:flex-start;margin:8px 0 0}
.bdnote .ic{margin-top:3px}
.sw{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:51px;height:31px;margin:0;border-radius:999px;background:var(--divider);box-shadow:inset 0 0 0 1px var(--border);position:relative;cursor:pointer;transition:background-color .25s}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.sw:checked{background:var(--key);box-shadow:none}
.sw:checked::before{transform:translateX(20px)}
.nochg{display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:var(--r-md);background:var(--key-bg);color:var(--text);font-size:16px;line-height:1.6;margin:12px 0 0}
.nochg .ic{color:var(--key);margin-top:3px}

/* ---------- 会計シートの折りたたみ ---------- */
.paysum{display:flex;flex-direction:column;align-items:center;padding:4px 0 8px}
.paysum>span{font-size:14px;color:var(--text-2);line-height:1.5}
.paysum .paytot{margin:0}
.paysum .taxline{margin:0}
.accs{border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--divider);overflow:hidden;margin:8px 0 4px}
.acc{border-bottom:1px solid var(--divider);background:var(--surface)}
.acc:last-child{border-bottom:0}
.acc summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 12px 0 16px;cursor:pointer;font-size:16px;font-weight:700}
.acc summary::-webkit-details-marker{display:none}
.acc summary:active{background:var(--key-bg)}
.acct{flex:0 0 auto}
.accv{flex:1;min-width:0;text-align:right;font-weight:400;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accc{color:var(--text-2);transition:transform .25s var(--ease)}
.acc[open] .accc{transform:rotate(90deg)}
.accb{padding:4px 16px 16px}
.acc[open] .accb{animation:accIn .3s var(--ease)}
@keyframes accIn{from{opacity:0;transform:translateY(-6px)}}
.accb .chips{margin:0}
.accb .seg{margin:0}
.accb .bd{margin:0}
/* 設定：各項目の「入れ方」 */
.mrow{display:flex;align-items:center;gap:12px;margin:8px 0 4px}
.mlab{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--text-2)}
.mrow .seg{flex:1;margin:0}

/* ---------- 設定：割引・サービス料・支払い方法 ---------- */
.steps{margin:0;padding:0 0 0 1.4em;font-size:16px;line-height:1.7}
.steps li{margin:4px 0}
.example{margin-top:12px;padding:16px;border-radius:var(--r-md);background:var(--surface);box-shadow:inset 0 0 0 1px var(--divider)}
.example>b{display:block;font-size:16px}
.example>small{display:block;font-size:14px;color:var(--text-2);margin-bottom:8px}
.example .exsum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px;font-weight:700}
.example .exsum b{font-size:24px}
.pmrow{padding-left:4px}
.pmdef{width:44px;height:44px;display:grid;place-items:center;flex:0 0 auto;cursor:pointer}
.pmdef input{width:24px;height:24px;margin:0;accent-color:var(--key)}
.pmrow small{display:block;font-size:14px;line-height:1.5}
.dtag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:999px;font-size:14px;font-weight:700;line-height:1.5;background:var(--key-bg);color:var(--key);box-shadow:inset 0 0 0 1px var(--key);vertical-align:1px}

/* ---------- 枠組み（iPhone：下にタブバー） ---------- */
.pane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.is-order .tabbar{display:none}
.split,.ticket,.menu{display:contents}
.lines{order:1}.sumbar{order:2}.cats{order:3}.igrid{order:4}.actions{order:5}
.kpi.wide{grid-column:1/-1}
.hcols>section{min-width:0}
.srow.on{background:var(--key-bg)}
.dtitle{font-size:22px!important;margin:0!important;padding:16px max(16px,env(safe-area-inset-right,0px)) 0 16px;line-height:1.5}

/* ---------- タブレット（iPad など、幅768px以上） ---------- */
@media (min-width:768px){
  #app{max-width:none;flex-direction:row}
  .tabbar{order:-1;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;width:96px;flex:0 0 96px;border-top:0;border-right:1px solid var(--divider);
    padding:16px 8px env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{min-height:72px;font-size:14px}
  .is-order .tabbar{display:flex}
  .nav.large{min-height:72px}
  .ltitle{font-size:32px}

  /* テーブル：大きな札 */
  .summary{grid-template-columns:repeat(3,minmax(0,220px))}
  .tgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tcard{min-height:148px;padding:16px}
  .tcard .tname{font-size:28px}
  .tcard .tamt{font-size:20px}
  .banner-w{max-width:720px}

  /* 注文：左に伝票、右に品目 */
  .split{display:grid;grid-template-columns:minmax(360px,40%) 1fr;flex:1;min-height:0}
  .ticket,.menu{display:flex;flex-direction:column;min-height:0;min-width:0}
  .ticket{background:var(--surface);border-right:1px solid var(--divider)}
  .ticket .lines{flex:1}
  .ticket .sumbar{padding-block:12px;border-bottom:0}
  .ticket .total{font-size:36px}
  .menu .cats{border-bottom:1px solid var(--divider)}
  .menu .igrid{flex:1;max-height:none;align-content:start;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;padding-block:16px}
  .menu .item{min-height:100px;padding:12px 14px}
  .menu .iname{font-size:17px}
  .actions{padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}

  /* 売上：指標を横一列、品目別と履歴を2列 */
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi.lead,.kpi.wide{grid-column:auto}
  .kpi.lead div{font-size:28px;line-height:1.5}
  .hcols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}

  /* 設定：左に一覧、右に中身 */
  .split-host{overflow:hidden}
  .ssplit{display:grid;grid-template-columns:minmax(300px,36%) 1fr;height:100%}
  .slist,.sdetail{overflow:auto;min-height:0}
  .slist{border-right:1px solid var(--divider)}
  .sdetail{background:var(--bg)}
  .sdetail .sec{max-width:720px}
  .srow .sval{max-width:40%}

  #toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- 長押しで並べ替え ---------- */
[data-rolist]>[data-roid]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;position:relative;background:var(--surface)}
.group.ro-on{overflow:visible}
[data-rolist].ro-on>[data-roid]{transition:transform .22s var(--ease)}
[data-roid].ro-lift{z-index:5;border-radius:var(--r-sm);box-shadow:var(--elev-3);scale:1.02;transition:scale .2s var(--ease),box-shadow .2s var(--ease)}
[data-roid].ro-drag{transition:scale .2s var(--ease),box-shadow .2s var(--ease)!important}
.rohint{display:flex;align-items:center;gap:8px}
/* ---------- 端末連携 ---------- */
.qrwrap{display:grid;justify-items:center;gap:8px;margin:8px 0}
.qrbox{background:#fff;padding:12px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px var(--divider);line-height:0}
.qrbox svg{width:min(72vw,300px);height:auto;display:block}
.steps{margin:0 0 8px;padding-left:1.5em;font-size:16px;line-height:1.7}
.steps li{margin:4px 0}
.scan{position:relative;width:min(100%,360px);margin:8px auto;aspect-ratio:1;border-radius:var(--r-md);overflow:hidden;background:#000}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .sframe{position:absolute;inset:14%;border:3px solid #fff;border-radius:var(--r-md);box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.syncst{display:flex;align-items:center;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;background:var(--success)}
.dot.off{background:var(--border)}
.codebox{width:100%;min-height:88px;font:14px/1.5 ui-monospace,Menlo,monospace;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);color:var(--text);word-break:break-all}
details.alt{margin-top:8px}
.loading{display:grid;justify-items:center;gap:16px;padding:32px 16px 24px;text-align:center}
.loading p{margin:0;font-size:16px;line-height:1.7;color:var(--text-2)}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--key-bg-2);border-top-color:var(--key);animation:spin .9s linear infinite!important}
@keyframes spin{to{transform:rotate(360deg)}}
details.alt summary{min-height:44px;display:flex;align-items:center;color:var(--key);font-weight:700;cursor:pointer}
.synchip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;line-height:1;padding:6px 10px;border-radius:999px;background:var(--key-bg);color:var(--key);white-space:nowrap}
.synchip.off{background:var(--error-bg);color:var(--error)}
#syov{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;padding:24px;background:var(--scrim)}
#syov.show{display:flex;animation:fade .3s ease both}
#syov .card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--elev-5);padding:24px;max-width:420px;width:100%;display:grid;gap:12px;text-align:center;justify-items:center}
#syov .card h2{margin:0;font-size:20px;line-height:1.5}
#syov .card p{margin:0;color:var(--text-2);font-size:16px;line-height:1.7}
#syov .card .btn{width:100%}
#syov .card .wic{color:var(--error)}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov" class="ov"><div class="modal" id="mbox" role="dialog" aria-modal="true" aria-labelledby="mtitle"></div></div>
<div id="fx" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="syov" role="alertdialog" aria-modal="true" aria-labelledby="syovh"></div>

<script>
/* 居酒屋レジ「あかり」— 本番版（kusakawad/izakaya-reji）と同じ機能・同じデータ形式。
   保存先は本番と別のキー。バックアップファイルは相互に読み書きできる。
   デザイン：Apple HIG（構造・操作）＋デジタル庁デザインシステム（色・文字・部品）。アイコンは Lucide（ISC License）をインライン化。 */
const KEY='izakaya-reji-akari-v1';

function normalize(D){
  if(!Array.isArray(D.cats)||!D.cats.length) D.cats=['ドリンク','フード','その他'];
  const old=D.cats.map(c=>typeof c==='string'?null:c);
  D.cats=D.cats.map(c=>typeof c==='string'?{id:uid(),name:c}:{id:c.id||uid(),name:String(c.name||'カテゴリ')});
  D.items.forEach(i=>{
    if(typeof i.cat==='number'||/^\d+$/.test(String(i.cat))){const c=D.cats[+i.cat];if(c&&!old[+i.cat])i.cat=c.id;}
    if(!D.cats.some(c=>c.id===i.cat))i.cat=D.cats[0].id;
  });
  D.tables.forEach(t=>{t.lines=t.lines||[];t.stack=t.stack||[];let fix=false;
    t.lines.forEach(l=>{if(!l.key){l.key=l.iid+'@'+l.price;fix=true;}if(l.base==null)l.base=l.price;});if(fix)t.stack=[];});
  D.sales=D.sales||[];
  D.tax=Object.assign(defTax(),D.tax||{});
  D.shop=Object.assign(defShop(),D.shop||{});
  /* 以前は割引・サービス料ごとに1つだった「入れ方」(mode) を、各項目の入れ方に引き継ぐ */
  const od=D.disc||{}, ov=D.svc||{};
  D.disc=Object.assign(defDisc(),od);
  D.svc=Object.assign(defSvc(),ov);
  if(od.mode){['pctMode','truncMode','taxMode'].forEach(k=>{if(!od[k])D.disc[k]=od.mode;});delete D.disc.mode;}
  if(ov.mode){['pctMode','fixedMode'].forEach(k=>{if(!ov[k])D.svc[k]=ov.mode;});delete D.svc.mode;}
  if(!D.pay||!Array.isArray(D.pay.methods)||!D.pay.methods.length) D.pay=defPay();
  D.pay.methods=D.pay.methods.map(m=>({id:m.id||uid(),name:String(m.name||'支払い方法'),change:m.change!==false}));
  if(!D.pay.methods.some(m=>m.id===D.pay.def)) D.pay.def=D.pay.methods[0].id;
  return D;
}

const total=t=>t.lines.reduce((a,l)=>a+l.price*l.qty,0);
const count=t=>t.lines.reduce((a,l)=>a+l.qty,0);
const pct=n=>(Math.round(n*100)/100)+'%';
const rateName=k=>k==='sub'?S.tax.subName:S.tax.mainName;
function rnd(x){const m=S.tax.round,e=1e-9;return m==='ceil'?Math.ceil(x-e):m==='round'?Math.round(x):(x<0?-Math.floor(-x+e):Math.floor(x+e));}
function calcBill(base,kind){
  const tx=S.tax, r=kind==='sub'?tx.sub:tx.main;
  let total,tax;
  if(tx.mode==='excl'){tax=rnd(base*r/100);total=base+tax;}
  else{
    const inc=tx.mode==='incSub'?tx.sub:tx.main;
    total=inc===r?base:rnd(base*(100+r)/(100+inc));
    tax=rnd(total*r/(100+r));
  }
  return {kind,name:rateName(kind),rate:r,mode:tx.mode,base,total,tax};
}
/* 割引・サービス料を入れた会計の計算。sel は会計時に選んだ項目（null のときは「すべての会計に入れる」項目だけ）
   順番：① ％割引と％サービス料はどちらもメニュー価格の合計にかける（重ねない） ② 固定のサービス料を足す
         ③ 消費税相当割引（消費税の前） ④ 消費税を計算する ⑤ 消費税相当割引（消費税の後）
         ⑥ 最後に切り捨て割引をかけ、消費税を計算し直す。％で出た1円未満は消費税と同じ端数処理 */
const itemMode=k=>({dpct:S.disc.pctMode,dtrunc:S.disc.truncMode,dtax:S.disc.taxMode,spct:S.svc.pctMode,sfix:S.svc.fixedMode})[k]||'ask';
function calcFull(t,kind,sel){
  const sub=total(t), g=t.guests||0, D=S.disc, V=S.svc, adj=[], on={};
  const use=(grp,k,val)=>(on[k]=val>0&&(itemMode(k)==='always'||!!(sel&&sel[k])));
  let base=sub;
  if(use(D,'dpct',D.pct)){const a=-rnd(sub*D.pct/100); if(a){adj.push({k:'dpct',label:D.pctLabel||'割引',note:pct(D.pct),amt:a}); base+=a;}}
  if(use(V,'spct',V.pct)){const a=rnd(sub*V.pct/100); if(a){adj.push({k:'spct',label:V.pctLabel||'サービス料',note:pct(V.pct),amt:a}); base+=a;}}
  if(use(V,'sfix',V.fixed)){const per=V.fixedPer==='guest', a=per?V.fixed*g:V.fixed;
    if(a){adj.push({k:'sfix',label:V.fixedLabel||'席料',note:per?`${yen(V.fixed)}×${g}名`:'',amt:a}); base+=a;}}
  const taxOn=use(D,'dtax',D.taxOn?1:0);
  /* 消費税相当割引（消費税の前）：ここまでの額にかかる消費税と同じ額を、消費税を計算する前に引く */
  if(taxOn&&D.taxWhen!=='after'){const t0=calcBill(base,kind).tax;
    if(t0){adj.push({k:'dtax',label:D.taxLabel||'消費税相当割引',note:'消費税の前',amt:-t0}); base-=t0;}}
  const b=calcBill(base,kind);
  let tot=b.total, tax=b.tax;
  /* 消費税相当割引（消費税の後）：税込額からその消費税額を引き、消費税を計算し直す */
  if(taxOn&&D.taxWhen==='after'&&tax){const a=-tax;
    adj.push({k:'dtax',label:D.taxLabel||'消費税相当割引',note:'消費税の後',amt:a,after:true}); tot+=a; tax=rnd(tot*b.rate/(100+b.rate));}
  if(use(D,'dtrunc',D.digits)&&tot>0){const u=10**D.digits, t2=Math.floor(tot/u)*u, a=t2-tot;

function bdRows(b,t,inter){
  const D=S.disc,V=S.svc,out=[];
  const amtOf=k=>b.on[k]?((b.adj.find(a=>a.k===k)||{}).amt||0):null;
  const R=(label,note,amt,k)=>{
    const ask=inter&&k&&itemMode(k)!=='always';
    const sw=ask?`<input type="checkbox" class="sw" data-psel="${k}" ${paySel[k]?'checked':''} aria-label="${esc(label)}を入れる">`:'';
    const always=inter&&k&&itemMode(k)==='always'?'<small class="always">すべての会計に適用</small>':'';
    const off=amt==null;
    return `<div class="bdr ${off?'off':''}"><label class="bdl">${sw}<span>${esc(label)}${note?`<small>${esc(note)}</small>`:''}${always}</span></label><b class="num">${off?'—':(k&&amt>0?'+':'')+yen(amt)}</b></div>`;
  };
  out.push(R(b.mode==='excl'?'小計（税抜）':'小計',`${count(t)}点`,b.sub));
  if(D.pct>0) out.push(R(D.pctLabel||'割引',`${pct(D.pct)}（メニュー計にかかる）`,amtOf('dpct'),'dpct'));
  if(V.pct>0) out.push(R(V.pctLabel||'サービス料',`${pct(V.pct)}（メニュー計にかかる）`,amtOf('spct'),'spct'));
  if(V.fixed>0){const per=V.fixedPer==='guest';
    out.push(R(V.fixedLabel||'席料',per?`${yen(V.fixed)}×${t.guests||0}名${t.guests?'':'（人数が未設定のため¥0）'}`:'1会計あたり',amtOf('sfix'),'sfix'));}
  const taxRow=()=>out.push(R(D.taxLabel||'消費税相当割引',D.taxWhen==='after'?'消費税の後に、その消費税と同じ額を引く':'消費税の前に、消費税と同じ額を引く',amtOf('dtax'),'dtax'));
  if(D.taxOn&&D.taxWhen!=='after') taxRow();
  if(b.pre!==b.base) out.push(R(b.mode==='excl'?`消費税（${pct(b.rate)}）`:`${b.name}（${pct(b.rate)}）適用`,'',b.pre-b.base));
  if(D.taxOn&&D.taxWhen==='after') taxRow();
  if(D.digits>0) out.push(R(D.truncLabel||'端数値引き',`${yen(10**D.digits)}未満を切り捨て（最後にかかる）`,amtOf('dtrunc'),'dtrunc'));
  return out;
}

/* ---------- 描画 ---------- */
/* 幅768px以上（iPad など）はタブレット用の配置に切り替える */
const tabMQ=(()=>{try{return matchMedia('(min-width: 768px)')}catch(e){return {matches:false}}})();
let isTab=!!tabMQ.matches;
window.addEventListener('resize',()=>{const n=!!tabMQ.matches; if(n!==isTab){isTab=n; render.route=null; render();}});
function render(){
  const keep={};
  document.querySelectorAll('[data-keep]').forEach(el=>keep[el.dataset.keep]=el.scrollTop);
  document.querySelectorAll('[data-keepx]').forEach(el=>keep['x'+el.dataset.keepx]=el.scrollLeft);
  const oldOn=document.querySelector('.cats .on'); prevCatRect=oldOn?{l:oldOn.offsetLeft,w:oldOn.offsetWidth}:null;

  if(SY.role==='sub'&&(view.name==='history'||(view.name==='settings'&&view.sub&&view.sub!=='sync')))view={name:view.name==='history'?'tables':'settings',sub:view.name==='history'?undefined:'sync'};
  const route=view.name+(view.tid||'')+(view.sub||'');
  const routeChanged=route!==render.route;
  const catChanged=view.name==='order'&&(routeChanged||curCat!==render.cat);
  const from=render.from;
  let enter='';
  if(routeChanged){
    if(from==null) enter='vt-fade';
    else if(view.name==='order') enter='vt-push';
    else if(from==='order') enter='vt-pop';
    else if(view.name==='settings'&&from==='settings') enter=isTab?'d:vt-fade':(view.sub?'vt-push':'vt-pop');
    else enter='vt-fade';
  }
  tabJust=routeChanged&&from!=null&&from!=='order'&&view.name!=='order'&&from!==view.name?view.name:null;
  render.route=route; render.cat=curCat; render.from=view.name;

  if(view.name==='order'){
    const t=curT();
    if(!t){view={name:'tables'};return render();}
    $('app').innerHTML=`<div class="pane">${orderView(t,enter,catChanged&&!routeChanged)}</div>${tabbar('tables')}`;
  }else{
    const body=view.name==='history'?historyView(enter):view.name==='settings'?(isTab?'':settingsView(view.sub)):tablesView(enter);
    $('app').innerHTML=`<div class="pane">${shell(body,view.name,enter)}</div>${tabbar(view.name)}`;
  }
  $('app').className=view.name==='order'?'is-order':'';
  if(!routeChanged){
    document.querySelectorAll('[data-keep]').forEach(el=>{const k=el.dataset.keep;if(keep[k]!=null&&!(k==='igrid'&&catChanged))el.scrollTop=keep[k]});
    document.querySelectorAll('[data-keepx]').forEach(el=>{const k='x'+el.dataset.keepx;if(keep[k]!=null)el.scrollLeft=keep[k]});
  }
  afterRender(routeChanged,catChanged);
  syncUi();
}
function afterRender(routeChanged,catChanged){
  const on=document.querySelector('.cats .on'), th=document.querySelector('.cthumb');
  if(on&&th){
    th.style.width=on.offsetWidth+'px'; th.style.transform=`translateX(${on.offsetLeft}px)`;
    if(prevCatRect&&catChanged&&!routeChanged&&!RM&&prevCatRect.l!==on.offsetLeft){
      th.animate([{transform:`translateX(${prevCatRect.l}px)`,width:prevCatRect.w+'px'},{transform:`translateX(${on.offsetLeft}px)`,width:on.offsetWidth+'px'}],{duration:380,easing:'cubic-bezier(.32,.72,0,1)'});
      on.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
    }
  }
  document.querySelectorAll('[data-roll]').forEach(el=>{
    const id=el.dataset.rid, to=+el.dataset.roll, fr=roll[id];
    roll[id]=to;
    if(!routeChanged&&fr!=null&&fr!==to)countTo(el,fr,to,yen,480,fr<to?300:0);
  });
  if(routeChanged) document.querySelectorAll('[data-count]').forEach((el,i)=>{
    const f=el.dataset.fmt, fn=f==='yen'?yen:f==='kumi'?n=>n+'組':n=>n+'名';
    countTo(el,0,+el.dataset.count,fn,800,i*60);
  });
  if(done&&done.fresh){const x=S.sales.find(s=>s.id===done.id);if(x)countTo($('donechg'),0,x.change,yen,800,400);done.fresh=false;}
  if(fxLine.key){
    const row=document.querySelector(`.line[data-k="${cssq(fxLine.key)}"]`), box=document.querySelector('.lines');
    if(row&&box){const r=row.getBoundingClientRect(),b=box.getBoundingClientRect();
      if(r.bottom>b.bottom)box.scrollTop+=r.bottom-b.bottom+8; else if(r.top<b.top)box.scrollTop-=b.top-r.top+8;}
  }
  fxLine={key:null,kind:null}; tabJust=null;
}
function countTo(el,from,to,fmt,dur=600,delay=0){
  if(!el)return;
  if(RM){el.textContent=fmt(to);return;}
  const t0=performance.now()+delay;
  el.textContent=fmt(from);
  const step=now=>{
    if(!el.isConnected)return;
    const p=Math.min(1,Math.max(0,(now-t0)/dur)), e=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(from+(to-from)*e));
    if(p<1)requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function flyChip(fromRect,name,key){
  if(RM)return;
  const target=document.querySelector(`.line[data-k="${cssq(key)}"]`)||document.querySelector('.lines');
  if(!target)return;
  const tr=target.getBoundingClientRect();
  const chip=document.createElement('div'); chip.className='flychip'; chip.innerHTML=ic('plus',14)+esc(name); $('fx').appendChild(chip);
  const cw=chip.offsetWidth, ch=chip.offsetHeight;
  const x0=fromRect.left+fromRect.width/2-cw/2, y0=fromRect.top+fromRect.height/2-ch/2;
  const x1=Math.max(8,tr.left+16), y1=tr.top+Math.min(tr.height,64)/2-ch/2;
  const xm=(x0+x1)/2, ym=Math.min(y0,y1)-40;
  chip.animate([
    {transform:`translate(${x0}px,${y0}px) scale(.6)`,opacity:0},
    {transform:`translate(${x0}px,${y0-12}px) scale(1)`,opacity:1,offset:.18},
    {transform:`translate(${xm}px,${ym}px) scale(1)`,opacity:1,offset:.55},
    {transform:`translate(${x1}px,${y1}px) scale(.85)`,opacity:0}
  ],{duration:560,easing:'cubic-bezier(.32,.72,0,1)'}).finished.then(()=>chip.remove(),()=>chip.remove());
  const tot=document.querySelector('.total');
  if(tot)tot.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:360,delay:340,easing:'cubic-bezier(.32,.72,0,1)'});
}

const z2h=s=>s.replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/[－−]/g,'-');
function parseMenu(text,defCid){
  const out={rows:[],bad:[],newCats:[]};
  let cur=null;
  text.split(/\r?\n/).forEach(raw=>{
    const line=z2h(raw).trim(); if(!line)return;
    const h=line.match(/^[【\[［#＃■]\s*([^】\]］]+?)\s*[】\]］]?$/);
    if(h&&!/[\t,，、]\s*[¥￥]?\s*-?\d/.test(line)){cur=h[1].trim();if(cur&&!S.cats.some(c=>c.name===cur)&&!out.newCats.includes(cur))out.newCats.push(cur);return;}
    const m=line.match(/^(.+?)[\t,，、\s]+[¥￥]?\s*(-?[\d,，]+)\s*円?(?:[\t,，、\s]+(時価|価格入力))?$/);
    if(!m){out.bad.push(raw.trim());return;}
    const name=m[1].trim().slice(0,20), price=parseInt(m[2].replace(/[,，]/g,''));
    if(!name||isNaN(price)){out.bad.push(raw.trim());return;}
    out.rows.push({name,price,ask:!!m[3],catName:cur});
  });
  out.rows.forEach(r=>{
    const c=r.catName?S.cats.find(x=>x.name===r.catName):S.cats.find(x=>x.id===defCid);
    r.exists=!!(c&&S.items.some(i=>i.cat===c.id&&i.name===r.name));
  });
  return out;
}

function nextSaleNo(ts){const k=dayKey(ts);return `${k}-${String(S.sales.filter(x=>dayKey(x.end)===k).length+1).padStart(4,'0')}`;}
function saleNo(x){if(x.no)return x.no;const k=dayKey(x.end);const same=S.sales.filter(s=>dayKey(s.end)===k);return `${k}-${String(same.indexOf(x)+1).padStart(4,'0')}`;}
const WD='日月火水木金土';
const jpDate=ts=>{const d=new Date(ts);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${WD[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const yenR=n=>(n<0?'-¥':'¥')+Math.abs(n).toLocaleString('ja-JP');
let logoImg=null, logoSrc='';
function getLogo(){
  if(!S.shop.logo)return Promise.resolve(null);
  if(logoImg&&logoSrc===S.shop.logo)return Promise.resolve(logoImg);
  return new Promise(res=>{const im=new Image();im.onload=()=>{logoImg=im;logoSrc=S.shop.logo;res(im);};im.onerror=()=>res(null);im.src=S.shop.logo;});
}
function loadLogo(file){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
      const maxW=576,maxH=240,sc=Math.min(1,maxW/im.width,maxH/im.height);
      const w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
      const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
      g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
      const d=g.getImageData(0,0,w,h),p=d.data;
      for(let i=0;i<p.length;i+=4){const y=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];p[i]=p[i+1]=p[i+2]=y;}
      g.putImageData(d,0,0);
      S.shop.logo=c.toDataURL('image/png'); logoImg=null; save(); render(); toast('ロゴを設定しました');
    };im.onerror=()=>toast('画像を読み込めませんでした');im.src=fr.result;};
  fr.readAsDataURL(file);
}
function receiptOps(x,kind){
  const sh=S.shop, ops=[], hasTax=x.taxRate!=null;
  const reduced=hasTax&&x.taxKind==='sub'&&x.taxRate<S.tax.main;
  const head=()=>{
    if(sh.logo)ops.push({t:'logo'});
    if(sh.name)ops.push({t:'text',s:sh.name,a:'c',z:1.5,b:1});
    if(sh.addr)ops.push({t:'text',s:sh.addr,a:'c',z:.85});
    if(sh.tel)ops.push({t:'text',s:'TEL '+sh.tel,a:'c',z:.85});
    if(sh.regno)ops.push({t:'text',s:'登録番号 '+sh.regno,a:'c',z:.85});
  };
  const taxBlock=()=>{
    if(!hasTax)return;
    ops.push({t:'lr',l:`${pct(x.taxRate)}対象${reduced?'（軽減）':''}`,r:yenR(x.total)});
    ops.push({t:'lr',l:'　内消費税等',r:yenR(x.tax)});
  };
  if(kind==='ryo'){
    if(sh.logo)ops.push({t:'logo'});
    ops.push({t:'title',s:'領 収 書'});
    ops.push({t:'gap',h:.6});
    ops.push({t:'text',s:jpDate(x.end),a:'r',z:.85});
    ops.push({t:'gap',h:.6});
    ops.push({t:'amount',s:yenR(x.total)+'-'});
    ops.push({t:'text',s:'但　'+(sh.tadashi||'御飲食代として'),a:'l'});
    ops.push({t:'text',s:'上記正に領収いたしました',a:'l',z:.85});
    ops.push({t:'rule'});
    ops.push({t:'text',s:'＜内訳＞',a:'l',z:.85});
    taxBlock();
    if(reduced)ops.push({t:'text',s:'※軽減税率（'+pct(x.taxRate)+'）対象',a:'l',z:.8});
    if(x.total>=50000)ops.push({t:'stamp'});
    ops.push({t:'rule'});
    if(sh.name)ops.push({t:'text',s:sh.name,a:'l',z:1.15,b:1});
    if(sh.addr)ops.push({t:'text',s:sh.addr,a:'l',z:.85});
    if(sh.tel)ops.push({t:'text',s:'TEL '+sh.tel,a:'l',z:.85});
    if(sh.regno)ops.push({t:'text',s:'登録番号 '+sh.regno,a:'l',z:.85});
    ops.push({t:'text',s:'No.'+saleNo(x),a:'l',z:.8});
    return ops;
  }
  head();
  ops.push({t:'gap',h:.6});
  ops.push({t:'text',s:jpDate(x.end),a:'l',z:.9});
  ops.push({t:'lr',l:'No.'+saleNo(x),r:`${x.table}${x.guests?'　'+x.guests+'名':''}`,z:.9});
  ops.push({t:'rule'});
  x.lines.forEach(l=>{
    const base=l.base??l.price, tag=l.price===base?'':(l.price===0?'（サービス）':'（値引）');
    const nm=l.name+(reduced?' ※':'')+tag;
    if(l.qty===1)ops.push({t:'lr',l:nm,r:yenR(l.price)});
    else{ops.push({t:'text',s:nm,a:'l'});ops.push({t:'lr',l:`　${yenR(l.price)} × ${l.qty}`,r:yenR(l.price*l.qty)});}
  });
  ops.push({t:'rule'});
  const cnt=x.lines.reduce((a,l)=>a+l.qty,0);
  /* 小計 → 割引・サービス料 → 消費税の差 → 切り捨て割引 → 合計（古い会計は adj がないので従来どおり） */
  const sub=x.sub??x.base, pre=x.pre??x.total, adj=x.adj||[], before=adj.filter(a=>!a.after), after=adj.filter(a=>a.after);
  const taxDiff=hasTax&&x.base!=null&&pre!==x.base;
  if(adj.length||taxDiff){
    ops.push({t:'lr',l:`${x.priceMode==='excl'?'小計（税抜）':'小計'}　${cnt}点`,r:yenR(sub)});
    before.forEach(a=>ops.push({t:'lr',l:a.label+(a.note?`（${a.note}）`:''),r:yenR(a.amt)}));
    if(taxDiff) ops.push({t:'lr',l:x.priceMode==='excl'?`消費税（${pct(x.taxRate)}）`:`${x.taxName}（${pct(x.taxRate)}）適用`,r:yenR(pre-x.base)});
    after.forEach(a=>ops.push({t:'lr',l:a.label,r:yenR(a.amt)}));
  }else ops.push({t:'lr',l:`点数`,r:`${cnt}点`,z:.9});
  ops.push({t:'lr',l:'合　計',r:yenR(x.total),z:1.45,b:1});
  taxBlock();
  ops.push({t:'gap',h:.3});
  if(x.payMethod) ops.push({t:'lr',l:'お支払い',r:x.payMethod});
  if(x.payChange!==false){
    ops.push({t:'lr',l:'お預り',r:yenR(x.paid)});
    ops.push({t:'lr',l:'お　釣',r:yenR(x.change)});
  }
  if(reduced)ops.push({t:'text',s:'※印は軽減税率対象商品',a:'l',z:.8});
  if(sh.footer){ops.push({t:'gap',h:.8});ops.push({t:'text',s:sh.footer,a:'c',z:.85});}
  return ops;
}
const RFONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif';
function drawReceipt(ops,logo){
  const paper=+S.shop.paper===80?80:58, dots=paper===80?576:384, SC=2;
  const W=dots*SC, PAD=8*SC, FS=24*SC, LH=1.38;
  const c=document.createElement('canvas'), g=c.getContext('2d');
  const font=(z=1,b=0)=>`${b?'700':'400'} ${Math.round(FS*z)}px ${RFONT}`;
  const wrap=(s,z,b,maxW)=>{g.font=font(z,b);const out=[];let cur='';for(const ch of String(s)){if(g.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch;}else cur+=ch;}out.push(cur);return out;};
  const inner=W-PAD*2;
  const steps=[]; let y=PAD;
  for(const o of ops){
    const z=o.z||1, lh=FS*z*LH;
    if(o.t==='gap'){y+=FS*(o.h||1);continue;}
    if(o.t==='rule'){steps.push({k:'rule',y:y+FS*.35});y+=FS*.8;continue;}
    if(o.t==='logo'&&logo){const w=Math.min(inner*.8,logo.width*SC),h=logo.height*w/logo.width;steps.push({k:'img',x:(W-w)/2,y,w,h});y+=h+FS*.4;continue;}
    if(o.t==='title'){steps.push({k:'title',s:o.s,y});y+=FS*2.6;continue;}
    if(o.t==='amount'){steps.push({k:'amount',s:o.s,y});y+=FS*3.2;continue;}
    if(o.t==='stamp'){steps.push({k:'stamp',y});y+=FS*4.6;continue;}
    if(o.t==='text'){for(const ln of wrap(o.s,z,o.b,inner)){steps.push({k:'text',s:ln,a:o.a,z,b:o.b,y});y+=lh;}continue;}
    if(o.t==='lr'){
      g.font=font(z,o.b);const rw=g.measureText(o.r).width;
      const ls=wrap(o.l,z,o.b,inner-rw-FS*.6);
      if(ls.length===1){steps.push({k:'lr',l:ls[0],r:o.r,z,b:o.b,y});y+=lh;}
      else{ls.forEach((ln,i)=>{steps.push(i===ls.length-1?{k:'lr',l:ln,r:o.r,z,b:o.b,y}:{k:'text',s:ln,a:'l',z,b:o.b,y});y+=lh;});}
      continue;
    }
  }
  c.width=W; c.height=Math.ceil(y+PAD*2);
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';g.strokeStyle='#000';g.textBaseline='top';
  for(const s of steps){
    if(s.k==='rule'){g.setLineDash([FS*.25,FS*.2]);g.lineWidth=SC*1.5;g.beginPath();g.moveTo(PAD,s.y);g.lineTo(W-PAD,s.y);g.stroke();g.setLineDash([]);}
    else if(s.k==='img')g.drawImage(logo,s.x,s.y,s.w,s.h);
    else if(s.k==='title'){g.font=font(1.7,1);g.textAlign='center';g.fillText(s.s,W/2,s.y+FS*.35);g.lineWidth=SC*2;g.strokeRect(PAD+inner*.2,s.y,inner*.6,FS*2.3);}
    else if(s.k==='amount'){g.font=font(2,1);g.textAlign='center';g.fillText(s.s,W/2,s.y+FS*.2);g.lineWidth=SC*2;g.beginPath();g.moveTo(PAD,s.y+FS*2.7);g.lineTo(W-PAD,s.y+FS*2.7);g.stroke();}
    else if(s.k==='stamp'){const bw=FS*3.6;g.lineWidth=SC*1.5;g.setLineDash([FS*.2,FS*.15]);g.strokeRect(W-PAD-bw,s.y+FS*.3,bw,bw);g.setLineDash([]);g.font=font(.75);g.textAlign='center';g.fillText('収入印紙',W-PAD-bw/2,s.y+FS*.3+bw/2-FS*.4);}
    else if(s.k==='text'){g.font=font(s.z,s.b);g.textAlign=s.a==='c'?'center':s.a==='r'?'right':'left';g.fillText(s.s,s.a==='c'?W/2:s.a==='r'?W-PAD:PAD,s.y);}
    else if(s.k==='lr'){g.font=font(s.z,s.b);g.textAlign='left';g.fillText(s.l,PAD,s.y);g.textAlign='right';g.fillText(s.r,W-PAD,s.y);}
  }
  return {canvas:c,paper,dots};
}
function imagePdf(canvas,printMm){
  const jpg=atob(canvas.toDataURL('image/jpeg',0.92).split(',')[1]);
  const wPt=printMm*72/25.4, hPt=wPt*canvas.height/canvas.width, f=n=>n.toFixed(2);
  const parts=[], offs=[]; let len=0;
  const add=s=>{parts.push(s);len+=s.length;};
  const obj=(n,body)=>{offs[n]=len;add(`${n} 0 obj\n${body}\nendobj\n`);};
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${f(wPt)} ${f(hPt)}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
  offs[4]=len; add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${canvas.width}/Height ${canvas.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`); add(jpg); add('\nendstream\nendobj\n');
  const cs=`q ${f(wPt)} 0 0 ${f(hPt)} 0 0 cm /Im0 Do Q`;
  obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
  const xref=len;
  add(`xref\n0 6\n0000000000 65535 f \n${[1,2,3,4,5].map(n=>String(offs[n]).padStart(10,'0')+' 00000 n \n').join('')}trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF\n`);
  const s=parts.join(''), u=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;
  return new Blob([u],{type:'application/pdf'});
}

async function shareReceipt(){
  if(!lastRcpt)return;
  const pdf=imagePdf(lastRcpt.canvas,lastRcpt.paper===80?72:48);
  try{
    const f=new File([pdf],lastRcpt.name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  saveFile(lastRcpt.name,pdf,'application/pdf',lastRcpt.label);
}

/* ---------- order ops ---------- */
function addItem(t,iid,price){
  const it=S.items.find(i=>i.id===iid); if(!it)return null;
  if(price==null)price=it.price;
  const key=iid+'@'+price;
  const l=t.lines.find(x=>x.key===key);
  if(l)l.qty++; else t.lines.push({key,iid,name:it.name,price,base:it.price,qty:1});
  t.stack.push(key);
  return {key,existed:!!l};
}
function incLine(t,key){const l=t.lines.find(x=>x.key===key);if(!l)return;l.qty++;t.stack.push(key);}
function decItem(t,key,fromUndo){
  const l=t.lines.find(x=>x.key===key); if(!l)return;
  l.qty--; if(l.qty<=0)t.lines=t.lines.filter(x=>x!==l);
  if(!fromUndo){const k=t.stack.lastIndexOf(key);if(k>=0)t.stack.splice(k,1);}
}
function repriceLine(t,key,price){
  const l=t.lines.find(x=>x.key===key); if(!l||l.price===price)return;
  const nk=l.iid+'@'+price, other=t.lines.find(x=>x.key===nk);
  if(other){other.qty+=l.qty;t.lines=t.lines.filter(x=>x!==l);}
  else{l.price=price;l.key=nk;}
  t.stack=t.stack.map(k=>k===key?nk:k);
  return nk;
}

/* CSV */
const csvCell=v=>{v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const csvJoin=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
const fullTime=ts=>{const d=new Date(ts);return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;};
const stamp=()=>{const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;};
function detailCSV(){
  const rows=[['会計No','会計日時','テーブル','人数','入店時刻','品名','単価','定価','数量','小計','備考','価格の扱い','税区分','税率(%)','メニュー価格計','消費税','会計合計(税込)','お預かり','おつり',
    '支払方法','割引(%)','サービス料(%)','サービス料(固定)','消費税相当割引','切り捨て割引','状態','取消日時']];
  const adjAmt=(x,k)=>{const a=(x.adj||[]).find(a=>a.k===k);return a?a.amt:'';};
  const ml=m=>m==='excl'?'税抜':m==='incSub'?'サブ税率込':m==='incMain'?'標準税率込':'';
  S.sales.forEach((x,i)=>x.lines.forEach((l,j)=>{
    const base=l.base??l.price, note=l.price===base?'':(l.price===0?'サービス':'価格変更'), f=j===0;
    rows.push([i+1,fullTime(x.end),x.table,x.guests||'',fullTime(x.start),l.name,l.price,base,l.qty,l.price*l.qty,note,
      f?ml(x.priceMode):'',f?(x.taxName||''):'',f?(x.taxRate??''):'',f?(x.sub??x.base??x.total):'',f?(x.tax??''):'',
      f?x.total:'',f?(x.payChange===false?'':x.paid):'',f?(x.payChange===false?'':x.change):'',
      f?(x.payMethod||''):'',f?adjAmt(x,'dpct'):'',f?adjAmt(x,'spct'):'',f?adjAmt(x,'sfix'):'',f?adjAmt(x,'dtax'):'',f?adjAmt(x,'dtrunc'):'',
      x.voided?'取消':'有効',x.voided?fullTime(x.voidedAt):'']);
  }));
  return csvJoin(rows);
}
function itemCSV(){
  const agg={}, live=S.sales.filter(x=>!x.voided), vd=S.sales.filter(x=>x.voided);
  live.forEach(x=>x.lines.forEach(l=>{const a=agg[l.name]=agg[l.name]||{q:0,amt:0,svc:0};a.q+=l.qty;a.amt+=l.price*l.qty;if(l.price===0&&(l.base??0)!==0)a.svc+=l.qty;}));
  const rows=[['品名','数量','うちサービス','金額']];
  Object.entries(agg).sort((a,b)=>b[1].amt-a[1].amt).forEach(([n,a])=>rows.push([n,a.q,a.svc,a.amt]));
  const sum=live.reduce((s,x)=>s+x.total,0), g=live.reduce((s,x)=>s+(x.guests||0),0);
  const adjSum=k=>live.reduce((s,x)=>s+((x.adj||[]).filter(a=>a.k===k).reduce((t,a)=>t+a.amt,0)),0);
  rows.push([],['売上合計(税込)','','',sum],['会計数','','',live.length],['客数','','',g],
    ['割引(%)合計','','',adjSum('dpct')],['消費税相当割引合計','','',adjSum('dtax')],['切り捨て割引合計','','',adjSum('dtrunc')],['サービス料(%)合計','','',adjSum('spct')],['サービス料(固定)合計','','',adjSum('sfix')],
    ['取り消し(集計外)',vd.length+'件','',vd.reduce((s,x)=>s+x.total,0)],[]);
  const pm={};live.forEach(x=>{const k=x.payMethod||'記録なし';const a=pm[k]=pm[k]||{n:0,t:0};a.n++;a.t+=x.total;});
  rows.push(['支払方法','件数','','税込合計']);Object.entries(pm).forEach(([k,a])=>rows.push([k,a.n,'',a.t]));rows.push([]);
  const by={};live.forEach(x=>{const k=(x.taxName||'不明')+(x.taxRate!=null?' '+x.taxRate+'%':'');const a=by[k]=by[k]||{n:0,t:0,tax:0};a.n++;a.t+=x.total;a.tax+=x.tax||0;});
  rows.push(['税区分','件数','うち消費税','税込合計']);
  Object.entries(by).forEach(([k,a])=>rows.push([k,a.n,a.tax,a.t]));
  return csvJoin(rows);
}

/* ---------- 長押しで並べ替え（品目・テーブル・カテゴリ） ----------
   [data-rolist] の直下にある [data-roid] の行が対象。約0.4秒押したままにすると持ち上がり、上下に動かして離すと入れ替わる。
   押してすぐ指を動かしたときは普通のスクロール、短く押したときは普通のタップのまま。 */
function roApply(list,ids){
  const order=arr=>{const m=new Map(arr.map(x=>[x.id,x]));const a=ids.map(id=>m.get(id)).filter(Boolean);return a.concat(arr.filter(x=>!ids.includes(x.id)));};
  if(list==='cats'){const cur=S.cats[curCat]&&S.cats[curCat].id;S.cats=order(S.cats);curCat=Math.max(0,S.cats.findIndex(c=>c.id===cur));}
  else if(list==='tables')S.tables=order(S.tables);
  else if(list.startsWith('items:')){const cid=list.slice(6),m=new Map(S.items.map(x=>[x.id,x]));
    const q=ids.map(id=>m.get(id)).filter(x=>x&&x.cat===cid);let k=0;
    S.items=S.items.map(x=>x.cat===cid&&k<q.length?q[k++]:x);}
  save();
}
const RO=(()=>{
  const LONG=400, SLOP=10;
  let st=null, suppress=0;
  const scrollParent=el=>{for(let p=el.parentElement;p;p=p.parentElement){const o=getComputedStyle(p).overflowY;if((o==='auto'||o==='scroll')&&p.scrollHeight>p.clientHeight)return p;}return document.scrollingElement||document.documentElement;};
  function begin(){
    if(!st)return;
    const {row,list}=st;
    st.rows=[...list.querySelectorAll(':scope>[data-roid]')];
    st.idx=st.rows.indexOf(row); st.to=st.idx;
    if(st.idx<0||st.rows.length<2){st=null;return;}
    st.rects=st.rows.map(r=>({top:r.offsetTop,h:r.offsetHeight}));
    st.sc=scrollParent(list); st.sc0=st.sc.scrollTop;
    st.on=true; suppress=Date.now()+100000;
    list.classList.add('ro-on'); row.classList.add('ro-lift','ro-drag');
    try{row.setPointerCapture(st.pid)}catch(e){}
    try{const s=getSelection();s&&s.removeAllRanges()}catch(e){}
    buzz(); loop();
  }
  function layout(){
    const dy=st.y-st.y0+(st.sc.scrollTop-st.sc0), r=st.rects[st.idx];
    st.row.style.transform=`translateY(${dy}px)`;
    /* 持ち上げた行の上端（下端）が、となりの行の真ん中を越えたら入れ替える */
    const top=r.top+dy, bot=top+r.h; let to=st.idx;
    st.rects.forEach((q,i)=>{const c=q.top+q.h/2; if(i<st.idx&&top<c)to=Math.min(to,i); else if(i>st.idx&&bot>c)to=Math.max(to,i);});
    st.to=to;
    st.rows.forEach((el,i)=>{if(i===st.idx)return;let sh=0;
      if(st.idx<to&&i>st.idx&&i<=to)sh=-r.h; else if(st.idx>to&&i<st.idx&&i>=to)sh=r.h;
      el.style.transform=sh?`translateY(${sh}px)`:'';});
  }
  function loop(){
    if(!st||!st.on)return;
    const sc=st.sc, root=sc===document.scrollingElement||sc===document.documentElement;
    const b=root?{top:0,bottom:innerHeight}:sc.getBoundingClientRect(), E=64;
    let v=0;
    if(st.y<b.top+E)v=-Math.ceil((b.top+E-st.y)/5); else if(st.y>b.bottom-E)v=Math.ceil((st.y-(b.bottom-E))/5);
    if(v){const before=sc.scrollTop;sc.scrollTop=before+v;if(sc.scrollTop!==before)layout();}
    st.raf=requestAnimationFrame(loop);
  }
  function finish(){
    if(!st)return;
    clearTimeout(st.timer);
    if(!st.on){st=null;return;}
    cancelAnimationFrame(st.raf);
    const {rows,idx,to,list,row,rects}=st; st=null;
    const ids=rows.map(r=>r.dataset.roid); const [mv]=ids.splice(idx,1); ids.splice(to,0,mv);
    const r=rects[idx], fy=to>idx?rects[to].top+rects[to].h-(r.top+r.h):to<idx?rects[to].top-r.top:0;
    row.classList.remove('ro-drag'); row.style.transition='transform .18s var(--ease),scale .18s var(--ease),box-shadow .18s var(--ease)';
    row.style.transform=`translateY(${fy}px)`; row.classList.remove('ro-lift');
    suppress=Date.now()+400;
    const go=()=>{list.classList.remove('ro-on'); if(to!==idx){roApply(list.dataset.rolist,ids);} render(); if(pendR){pendR=false;}};
    if(RM)go(); else setTimeout(go,190);
  }
  function cancel(){if(st){clearTimeout(st.timer);st=null;}}
  document.addEventListener('pointerdown',e=>{
    if(st||(e.pointerType==='mouse'&&e.button!==0))return;
    const row=e.target.closest('[data-roid]'); if(!row)return;
    const list=row.parentElement; if(!list||!list.hasAttribute('data-rolist'))return;
    st={row,list,pid:e.pointerId,x0:e.clientX,y0:e.clientY,y:e.clientY,on:false};
    st.timer=setTimeout(begin,LONG);
  });
  document.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.pid)return;
    st.y=e.clientY;
    if(!st.on){if(Math.hypot(e.clientX-st.x0,e.clientY-st.y0)>SLOP)cancel();return;}
    e.preventDefault(); layout();
  },{passive:false});
  document.addEventListener('pointerup',e=>{if(st&&e.pointerId===st.pid)finish();});
  document.addEventListener('pointercancel',e=>{if(st&&e.pointerId===st.pid){if(st.on)finish();else cancel();}});
  /* 持ち上げている間は画面がスクロールしないようにする（iPhone の Safari） */
  document.addEventListener('touchmove',e=>{if(st&&st.on)e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-roid]'))e.preventDefault();});
  document.addEventListener('selectstart',e=>{if(st&&st.on)e.preventDefault();});
  /* 動かしたあとの指を離した操作は、タップ（編集を開くなど）として扱わない */
  document.addEventListener('click',e=>{if(Date.now()<suppress){suppress=0;e.preventDefault();e.stopPropagation();}},true);
  return {busy:()=>!!(st&&st.on)};
})();

/* ---------- 端末連携（試作） ----------
   同じ Wi-Fi の端末どうしを WebRTC で直接つなぐ。仲介サーバーは使わず、接続の情報は QR コードを2回読んで交換する。
   データを持つのはホストだけ。サブは操作（テーブル・会計の変化）をホストへ送り、ホストは最新の状態を全サブへ配る。
   外部の STUN/TURN サーバーは指定しないので、通信は同じネットワークの中だけで成り立つ。 */
const RTC_CFG={iceServers:[]};
const CHUNK=12000;
let scanStream=null, scanRAF=0, scanCb=null, pendR=false;
function saveSync(){try{localStorage.setItem(SYNCK,JSON.stringify({role:SY.role,name:SY.name}))}catch(e){}}

  if(SY.role==='host'){const n=SY.peers.filter(p=>p.ok).length;return n?`<span class="synchip">${ic('link',16)}連携 ${n}台</span>`:'';}
  return '';
}

function syncRender(){
  const a=document.activeElement;

document.addEventListener('focusout',()=>{if(pendR)setTimeout(()=>{const a=document.activeElement;if(pendR&&!(a&&a.closest&&a.closest('#app')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){pendR=false;render();}},0);});

/* --- 送受信（大きいデータは分けて送る） --- */
function sendJSON(dc,obj){
  if(!dc||dc.readyState!=='open')return;
  const s=JSON.stringify(obj);
  try{
    if(s.length<=CHUNK){dc.send(s);return;}
    const id=uid(), n=Math.ceil(s.length/CHUNK);
    for(let i=0;i<n;i++)dc.send(JSON.stringify({t:'ck',id,i,n,s:s.slice(i*CHUNK,(i+1)*CHUNK)}));
  }catch(e){}
}
function onRaw(peer,data,handler){
  peer.rx=Date.now();
  let m; try{m=JSON.parse(data)}catch(e){return}
  if(m.t==='ck'){
    const b=peer.ck[m.id]=peer.ck[m.id]||{n:m.n,got:0,p:[]};
    if(b.p[m.i]==null){b.p[m.i]=m.s;b.got++;}
    if(b.got<b.n)return;
    delete peer.ck[m.id];
    try{m=JSON.parse(b.p.join(''))}catch(e){return}
  }
  if(m.t==='ping')return;
  handler(peer,m);
}

/* --- 接続情報を QR に入る長さにする（SDP を圧縮して base64url） --- */
const b64u=bytes=>{let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=t=>{const bin=atob(t.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(bin,c=>c.charCodeAt(0));};
async function pipeBytes(bytes,stream){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());}
async function packSdp(kind,sdp){
  const body=sdp.split(/\r?\n/).filter(l=>l&&!/^a=(extmap-allow-mixed|msid-semantic)/.test(l)).join('\n');
  let bytes=new TextEncoder().encode(body), mode='0';
  if(window.CompressionStream){try{bytes=await pipeBytes(bytes,new CompressionStream('deflate-raw'));mode='1';}catch(e){}}
  return 'AKR'+mode+kind+b64u(bytes);
}
async function unpackSdp(txt){
  const m=/^AKR([01])([oa])([A-Za-z0-9_-]+)$/.exec(String(txt).trim()); if(!m)return null;
  let bytes=unb64u(m[3]);
  if(m[1]==='1'){if(!window.DecompressionStream)throw new Error('old');bytes=await pipeBytes(bytes,new DecompressionStream('deflate-raw'));}
  return {kind:m[2],sdp:new TextDecoder().decode(bytes).split('\n').join('\r\n')+'\r\n'};
}
function waitIce(pc){return new Promise(res=>{
  if(pc.iceGatheringState==='complete')return res();
  const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);res();}};
  pc.addEventListener('icegatheringstatechange',f); setTimeout(res,3000);
});}
function qrSvg(text){
  const q=qrcode(0,'M'); q.addData(text,'Byte'); q.make();
  const n=q.getModuleCount(), M=4; let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+M} ${r+M}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+M*2} ${n+M*2}" role="img" aria-label="接続用のQRコード" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
const codeAlt=code=>`<details class="alt"><summary>カメラが使えないとき</summary><p class="note">下のコードをコピーして、相手の端末の「コードを貼り付け」に入れても接続できます。</p>
  <textarea class="codebox" readonly>${esc(code)}</textarea><div class="btnrow"><button class="btn btn-line btn-sm" data-a="sycopy" data-v="${esc(code)}">${ic('copy',18)}コードをコピー</button></div></details>`;

/* --- カメラで QR を読む --- */
async function openScan(title,lead,cb){
  stopScan(); scanCb=cb;
  showModal(`${sheetHead(title)}<div class="mb"><p class="note">${lead}</p>
    <div class="scan"><video id="scanv" playsinline muted autoplay></video><span class="sframe" aria-hidden="true"></span></div>
    <p class="note" id="scanmsg" role="status">カメラを準備しています…</p>
    <details class="alt"><summary>コードを貼り付け</summary><textarea class="codebox" id="sycodein" placeholder="AKR から始まるコード"></textarea>
    <div class="btnrow"><button class="btn btn-line btn-sm" data-a="sycode">このコードでつなぐ</button></div></details></div>
    <div class="mbtns"><button class="btn btn-line" data-a="mclose">キャンセル</button></div>`);
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    if(scanCb!==cb){stream.getTracks().forEach(t=>t.stop());return;}
    scanStream=stream;
  }catch(e){const m=$('scanmsg');if(m)m.textContent='カメラを使えませんでした。ブラウザの設定でカメラを許可するか、「コードを貼り付け」を使ってください。';return;}
  const v=$('scanv'); if(!v){stopScan();return;}
  v.srcObject=scanStream; try{await v.play()}catch(e){}
  const msg=$('scanmsg'); if(msg)msg.textContent='QRコードを枠の中に写してください。';
  const c=document.createElement('canvas'), g=c.getContext('2d',{willReadFrequently:true});
  const tick=()=>{
    if(!scanStream)return;
    if(v.readyState>=2&&v.videoWidth){
      const w=v.videoWidth,h=v.videoHeight,k=Math.min(1,960/Math.max(w,h));
      c.width=Math.round(w*k);c.height=Math.round(h*k);g.drawImage(v,0,0,c.width,c.height);
      const r=self.jsQR(g.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'dontInvert'});
      if(r&&r.data&&r.data.startsWith('AKR')){const f=scanCb;scanCb=null;stopScan();if(f)f(r.data);return;}
    }
    scanRAF=requestAnimationFrame(tick);
  };
  tick();
}
function stopScan(){cancelAnimationFrame(scanRAF);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}
const loadingSheet=(t,m)=>showModal(`${sheetHead(t)}<div class="mb" id="sywait"><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span><p>${m}</p></div></div><div class="mbtns"><button class="btn btn-line" data-a="mclose">キャンセル</button></div>`);
/* WebRTC が使えない・接続先のアドレスが取れないときの説明 */
function rtcErr(e){
  if(typeof RTCPeerConnection==='undefined')return 'この画面では端末どうしの通信（WebRTC）が使えません。ホーム画面に追加したアプリ（本番の URL）でお試しください。';
  if(e&&e.message==='nocand')return '接続に使うこの端末のアドレスを取得できませんでした。Wi-Fi につながっているか確かめてください。テスト版のページでは通信が制限されている場合があります。';
  return '接続の準備ができませんでした。もう一度お試しください。'+(e&&(e.name||e.message)?`（${esc(e.name||e.message)}）`:'');
}
const hasCand=sdp=>/\r?\na=candidate:/.test(sdp);
const syncErr=(t,m)=>showModal(`${sheetHead(t)}<div class="mb"><p class="note warn">${ic('alert',20)}<span>${m}</span></p></div><div class="mbtns"><button class="btn btn-fill" data-a="mclose">閉じる</button></div>`);
const unpackErr=e=>e&&e.message==='old'?'この端末のブラウザが古いため読み取れません。iOS（iPadOS）を最新にしてください。':'接続用のQRコードではないようです。';

/* --- ホスト（親機） --- */
async function hostAdd(){
  if(SY.role==='sub'){toast('サブとして使っている間はホストにできません');return;}
  syncDropPending();
  loadingSheet('サブ端末を追加','接続用のQRコードを用意しています…');
  let p;
  try{
    p={id:uid(),name:'',ok:false,ck:{},rx:0,ack:0,pc:new RTCPeerConnection(RTC_CFG)};
    p.dc=p.pc.createDataChannel('reji',{ordered:true});
  }catch(e){syncErr('サブ端末を追加',rtcErr(e));return;}
  p.dc.onopen=()=>{
    p.ok=true; p.rx=Date.now(); if(SY.pending===p)SY.pending=null;
    if(!SY.peers.includes(p))SY.peers.push(p);
    SY.role='host'; saveSync(); wakeOn();
    sendState(p, snap());
    if(modalOpen()&&$('sywait'))closeModal();
    toast('サブ端末と接続しました'); syncRender();
  };
  p.dc.onmessage=ev=>onRaw(p,ev.data,hostMsg);
  p.dc.onclose=()=>dropPeer(p);
  p.pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(p.pc.connectionState))dropPeer(p);};
  SY.pending=p;
  let code='';
  try{
    await p.pc.setLocalDescription(await p.pc.createOffer()); await waitIce(p.pc);
    if(SY.pending!==p)return;
    if(!hasCand(p.pc.localDescription.sdp))throw new Error('nocand');
    code=await packSdp('o',p.pc.localDescription.sdp);
  }catch(e){if(SY.pending===p){SY.pending=null;try{p.pc.close()}catch(_){}syncErr('サブ端末を追加',rtcErr(e));}return;}
  if(SY.pending!==p)return;
  SY.pending=p;
  $('mbox').innerHTML=`${sheetHead('サブ端末を追加')}<div class="mb">
    <ol class="steps"><li>サブ端末で「設定 › 端末連携 › ホストにつなぐ」を押し、このQRを読み取ります。</li><li>サブ端末に出たQRを、下のボタンから読み取ります。</li></ol>
    <div class="qrwrap"><div class="qrbox">${qrSvg(code)}</div></div>${codeAlt(code)}</div>
    <div class="mbtns"><button class="btn btn-line" data-a="mclose">キャンセル</button><button class="btn btn-fill" data-a="syscan2">${ic('scan',20)}サブのQRを読み取る</button></div>`;
}

/* シートを閉じたとき、まだつながっていない準備中の接続を片付ける */
function syncDropPending(){const p=SY.pending;if(p&&!p.ok){SY.pending=null;try{p.pc.close()}catch(e){}}}
function hostMsg(p,m){
  if(m.t==='hi'){p.name=String(m.name||'').slice(0,16);syncRender();return;}
  if(m.t==='ops'){
    p.ack=Math.max(p.ack,+m.seq||0);
    (m.tables||[]).forEach(t=>{const i=S.tables.findIndex(x=>x.id===t.id);if(i>=0&&t&&Array.isArray(t.lines))S.tables[i]=t;});
    (m.sales||[]).forEach(x=>{if(!x||!x.id||!Array.isArray(x.lines))return;
      const cur=S.sales.find(s=>s.id===x.id);
      if(cur){if(x.voided&&!cur.voided){cur.voided=true;cur.voidedAt=x.voidedAt||Date.now();}}
      else{x.no=nextSaleNo(x.end||Date.now());x.by=p.name||'サブ';S.sales.push(x);}});
    save(); syncRender();

function dropPeer(p){
  if(SY.pending===p)SY.pending=null;

  SY.peers=SY.peers.filter(x=>x!==p); p.ok=false;
  try{p.dc&&p.dc.close()}catch(e){} try{p.pc.close()}catch(e){}

/* サブへ配るデータ：売上は今日（直近12時間）の分だけ */
function snap(){const now=Date.now(),k=dayKey(now);return {...S,sales:S.sales.filter(x=>dayKey(x.end)===k||now-x.end<12*3600e3)};}
function sendState(p,d){sendJSON(p.dc,{t:'state',d,ack:p.ack,host:synName()});}
